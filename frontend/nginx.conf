server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aplicação de página única: qualquer rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets do Vite têm hash no nome, então podem ser cacheados para
    # sempre. O index.html, nunca — senão o navegador fica numa versão velha.
    location ~* \.(js|css|woff2?|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

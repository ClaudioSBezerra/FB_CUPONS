# Frontend do Cupons ITD: serve a SPA e repassa /api para a API.
#
# Por que o nginx repassa /api em vez de o navegador falar direto com a API:
#  * o cookie de sessão fica first-party, sem CORS e sem SameSite=None;
#  * o deploy precisa de UM domínio só, o que simplifica tanto o Caddy do
#    compose de produção quanto o proxy do Coolify (sem roteamento por path).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload de um lote de cupons: o padrão do nginx é 1 MB, o que recusaria
    # um PDF escaneado com 413 antes de a API ver o arquivo.
    client_max_body_size 64m;

    # Resolver do Docker com upstream em variável: assim o nginx sobe mesmo
    # que o contêiner da API ainda não exista. Com o nome do host direto no
    # proxy_pass, o nginx resolve no boot e morre com "host not found".
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $upstream_api "api:8080";
        proxy_pass http://$upstream_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ler um PDF de 20 páginas pela API de visão leva minutos.
        proxy_connect_timeout 30s;
        proxy_send_timeout    15m;
        proxy_read_timeout    15m;

        # Streaming do upload: não acumula o PDF inteiro em disco antes de
        # repassar.
        proxy_request_buffering off;
    }

    # Sondas de saúde da API, para o proxy externo e o healthcheck.
    location ~ ^/(healthz|readyz)$ {
        set $upstream_saude "api:8080";
        proxy_pass http://$upstream_saude;
        access_log off;
    }

    # Aplicação de página única: qualquer rota cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets do Vite têm hash no nome, então podem ser cacheados para
    # sempre. O index.html, nunca — senão o navegador fica numa versão velha.
    location ~* \.(js|css|woff2?|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# Cupons ITD — produção no VPS Hostinger, em https://cupom.fbtax.cloud
#
# No VPS:
#   git clone https://github.com/ClaudioSBezerra/FB_CUPONS.git
#   cd FB_CUPONS
#   cp .env.example .env && nano .env       # preencha TODOS os segredos
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Antes de subir, aponte o DNS:
#   cupom.fbtax.cloud  A  <IP do VPS>
# O Caddy emite e renova o certificado Let's Encrypt sozinho, desde que as
# portas 80 e 443 estejam abertas e o DNS já esteja propagado.

name: cupons-itd

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Dirigido pelas mesmas DB_* que a API usa: um nome por coisa,
      # como nos outros projetos FB. Vale só na PRIMEIRA inicialização
      # do volume — trocar depois exige ALTER USER no banco.
      POSTGRES_DB: ${DB_NAME:-cupons}
      POSTGRES_USER: ${DB_USER:-cupons}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      TZ: America/Sao_Paulo
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    # Em produção o banco NÃO é publicado: só a rede interna do compose
    # alcança a porta 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cupons} -d ${DB_NAME:-cupons}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORTA: 8080
      AMBIENTE: producao
      # As partes vão separadas de propósito: a API monta a DSN com
      # percent-encoding, então senha com espaço, "@", "/" ou "#" funciona.
      # Colar a senha dentro de uma URL aqui quebrava o deploy.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-cupons}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-cupons}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo 32 caracteres)}
      SESSAO_HORAS: ${SESSAO_HORAS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no .env}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA no .env}
      CORS_ORIGENS: ${DOMINIO_URL:-https://cupom.fbtax.cloud}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}

      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?defina ANTHROPIC_API_KEY no .env}
      # Endereço da API. Vazio = api.anthropic.com. Preencha se a chave for
      # de um gateway compatível com a API Messages (OmniRoute, proxy).
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL-}
      # Recursos exclusivos da Anthropic (cache de prompt, raciocínio
      # adaptativo, saída estruturada por schema). Vazio decide pelo
      # endereço: ligado em api.anthropic.com, desligado fora dela.
      LEITURA_RECURSOS_ANTHROPIC: ${LEITURA_RECURSOS_ANTHROPIC-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      CLAUDE_MODEL_FORTE: ${CLAUDE_MODEL_FORTE:-claude-fable-5}
      CLAUDE_ESFORCO: ${CLAUDE_ESFORCO:-high}
      CLAUDE_TIMEOUT_S: ${CLAUDE_TIMEOUT_S:-180}
      LEITURA_CONCORRENCIA: ${LEITURA_CONCORRENCIA:-3}
      LEITURA_LADO_MAX: ${LEITURA_LADO_MAX:-1568}
      LIMITE_LEITURAS_DIA: ${LIMITE_LEITURAS_DIA:-200}
      PDF_DPI: ${PDF_DPI:-300}
    # Não publica porta: quem fala com a API é o Caddy, pela rede interna.
    logging: *logging

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    depends_on:
      - api
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMINIO: ${DOMINIO:-cupom.fbtax.cloud}
      EMAIL_ACME: ${EMAIL_ACME:?defina EMAIL_ACME no .env (avisos de certificado)}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data      # certificados: NÃO apague, senão rebate o
      - caddy-config:/config   # rate limit do Let's Encrypt
    logging: *logging

  # Backup diário do Postgres com retenção. Roda como serviço próprio para
  # não depender de cron no host.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-cupons}
      PGUSER: ${DB_USER:-cupons}
      PGPASSWORD: ${DB_PASSWORD}
      RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-14}
      HORA_BACKUP: ${BACKUP_HORA:-03}
      TZ: America/Sao_Paulo
    volumes:
      - ./backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    logging: *logging

volumes:
  postgres-dados:
  caddy-dados:
  caddy-config:

# Cupons ITD — desenvolvimento local.
#
#   cp .env.example .env    # preencha ANTHROPIC_API_KEY, JWT_SECRET, senhas
#   docker compose up --build
#
# A API fica em http://localhost:8080 e o frontend em http://localhost:5173.
# Para produção use deploy/docker-compose.prod.yml, que acrescenta o proxy
# HTTPS para cupom.fbtax.cloud.

name: cupons-itd

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Dirigido pelas mesmas DB_* que a API usa: um nome por coisa,
      # como nos outros projetos FB. Vale só na PRIMEIRA inicialização
      # do volume — trocar depois exige ALTER USER no banco.
      POSTGRES_DB: ${DB_NAME:-cupons}
      POSTGRES_USER: ${DB_USER:-cupons}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      # Locale pt-BR para ordenação correta de nomes com acento.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      TZ: America/Sao_Paulo
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    ports:
      # Exposto só no localhost: útil para psql e DBeaver, sem abrir o banco.
      # A porta do host é configurável porque muita máquina já tem um Postgres
      # nativo na 5432; a API não usa esta porta (fala pela rede interna).
      - "127.0.0.1:${POSTGRES_PORTA:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cupons} -d ${DB_NAME:-cupons}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORTA: 8080
      AMBIENTE: ${AMBIENTE:-desenvolvimento}
      # As partes vão separadas de propósito: a API monta a DSN com
      # percent-encoding, então senha com espaço, "@", "/" ou "#" funciona.
      # Colar a senha dentro de uma URL aqui quebrava o deploy.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-cupons}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-cupons}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (mínimo 32 caracteres)}
      SESSAO_HORAS: ${SESSAO_HORAS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}

      # Leitura via Claude. Sem a chave, a API sobe e tudo funciona menos a
      # importação automática por PDF.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      CLAUDE_MODEL_FORTE: ${CLAUDE_MODEL_FORTE:-claude-fable-5}
      CLAUDE_ESFORCO: ${CLAUDE_ESFORCO:-high}
      CLAUDE_TIMEOUT_S: ${CLAUDE_TIMEOUT_S:-180}
      LEITURA_CONCORRENCIA: ${LEITURA_CONCORRENCIA:-3}
      LEITURA_LADO_MAX: ${LEITURA_LADO_MAX:-1568}
      LIMITE_LEITURAS_DIA: ${LIMITE_LEITURAS_DIA:-0}
      PDF_DPI: ${PDF_DPI:-300}
    ports:
      - "${API_PORTA:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORTA:-5173}:80"

volumes:
  postgres-dados:

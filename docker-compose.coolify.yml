# Cupons ITD — deploy no Coolify.
#
# Use ESTE arquivo no Coolify, não o docker-compose.prod.yml: aquele sobe um
# Caddy próprio, que disputaria as portas 80/443 com o proxy do Coolify.
#
# Diferenças em relação aos outros compose:
#
#  * Nenhum serviço publica porta no host. Quem roteia é o proxy do Coolify,
#    que alcança os contêineres pela rede interna. Publicar porta foi o que
#    causou o erro "Bind for 0.0.0.0:8080 failed: port is already allocated"
#    — e, além do conflito, deixaria a API exposta sem HTTPS.
#
#  * Só o frontend recebe domínio. O nginx dele repassa /api para a API, então
#    o Coolify não precisa de roteamento por path e o cookie de sessão fica
#    first-party.
#
# Este arquivo fica na RAIZ do repositório, e não em deploy/, de propósito: o
# Coolify roda o compose com --project-directory na raiz, e o Docker Compose
# resolve build.context contra o project directory, não contra a pasta do
# arquivo. Em deploy/, um "context: ../backend" apontaria para FORA do
# repositório e o build falharia.
#
# No Coolify:
#   1. Novo recurso → Docker Compose (baseado em Git)
#   2. Em Docker Compose Location, informe: /docker-compose.coolify.yml
#      (o padrão é /docker-compose.yml, que é o de DESENVOLVIMENTO e publica
#      porta no host — foi o que causou "port is already allocated")
#   3. Em Environment Variables, defina os segredos (lista abaixo)
#   4. Em Environment Variables, acrescente CLOUDFLARE_TUNNEL_TOKEN (ver
#      abaixo, no serviço cloudflared). O campo Domains é irrelevante aqui:
#      quem entrega o tráfego é o túnel, não o proxy do Coolify.
#   5. Deploy
#
# Variáveis do painel: copie o bloco de coolify-env-template.txt.
#
# Obrigatórias (sem elas o deploy nem começa):
#   DB_PASSWORD   JWT_SECRET
#
# Recomendadas (sem elas a API SOBE, mas avisa no log):
#   ADMIN_EMAIL   ADMIN_SENHA   — sem senha válida, uma é sorteada e anunciada
#                                 no log; sem e-mail, nenhum usuário é criado
#   DOMINIO_URL                 — origem liberada no CORS
#   ANTHROPIC_API_KEY           — sem ela a importação por PDF fica desativada

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Dirigido pelas mesmas DB_* que a API usa: um nome por coisa,
      # como nos outros projetos FB. Vale só na PRIMEIRA inicialização
      # do volume — trocar depois exige ALTER USER no banco.
      POSTGRES_DB: ${DB_NAME:-cupons}
      POSTGRES_USER: ${DB_USER:-cupons}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
      TZ: America/Sao_Paulo
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cupons} -d ${DB_NAME:-cupons}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORTA: 8080
      AMBIENTE: producao
      # As partes vão separadas de propósito: a API monta a DSN com
      # percent-encoding, então senha com espaço, "@", "/" ou "#" funciona.
      # Colar a senha dentro de uma URL aqui quebrava o deploy.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-cupons}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-cupons}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no painel do Coolify}
      SESSAO_HORAS: ${SESSAO_HORAS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL no painel do Coolify}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA no painel do Coolify}

      # O navegador fala só com o frontend, que repassa /api pela rede
      # interna: a requisição chega à API na mesma origem e o CORS não entra
      # no caminho. DOMINIO_URL continua aqui para o caso de um cliente
      # externo (script, celular) precisar de origem liberada.
      CORS_ORIGENS: ${DOMINIO_URL:-https://cupom.fbtax.cloud}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}

      # Opcional de propósito: sem a chave a API sobe e tudo funciona menos a
      # importação automática por PDF — cadastros, revisão manual, cobrança e
      # Excel seguem valendo, e a aba Importar aparece desativada com o motivo.
      # Preencher depois no painel e redeployar habilita a leitura.
      # --- Provedor da leitura -------------------------------------------
      # "anthropic" (padrão) ou "openai". Vazio decide pela chave presente.
      LEITURA_PROVEDOR: ${LEITURA_PROVEDOR-}
      OPENAI_API_KEY: ${OPENAI_API_KEY-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      # Saída estruturada por schema no provedor OpenAI. Desligue se o
      # endereço for um gateway que não suporte json_schema.
      LEITURA_ESTRUTURADA: ${LEITURA_ESTRUTURADA-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY-}
      # Endereço da API. Vazio = api.anthropic.com. Preencha se a chave for
      # de um gateway compatível com a API Messages (OmniRoute, proxy).
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL-}
      # Recursos exclusivos da Anthropic (cache de prompt, raciocínio
      # adaptativo, saída estruturada por schema). Vazio decide pelo
      # endereço: ligado em api.anthropic.com, desligado fora dela.
      LEITURA_RECURSOS_ANTHROPIC: ${LEITURA_RECURSOS_ANTHROPIC-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5}
      CLAUDE_MODEL_FORTE: ${CLAUDE_MODEL_FORTE:-claude-fable-5}
      CLAUDE_ESFORCO: ${CLAUDE_ESFORCO:-high}
      CLAUDE_TIMEOUT_S: ${CLAUDE_TIMEOUT_S:-180}
      LEITURA_CONCORRENCIA: ${LEITURA_CONCORRENCIA:-3}
      LEITURA_LADO_MAX: ${LEITURA_LADO_MAX:-1568}
      LIMITE_LEITURAS_DIA: ${LIMITE_LEITURAS_DIA:-200}
      PDF_DPI: ${PDF_DPI:-300}

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    # O domínio é atribuído SOMENTE pela aba Domains do painel, apontando
    # para este serviço. Não use a variável mágica SERVICE_FQDN_*: ela mexe no
    # mesmo roteador do Traefik e os dois mecanismos juntos produzem regra
    # inválida.
    #
    # No campo Domains, informe a URL COM o esquema:
    #
    #     https://cupom.fbtax.cloud
    #
    # Sem o "https://", o Coolify trata o valor como CAMINHO e gera
    #   rule: Host(``) && PathPrefix(`cupom.fbtax.cloud`)
    # que não casa com nenhuma requisição — o sintoma é 404 do Traefik mesmo
    # com o Host certo. Sem o esquema também não nasce roteador https, e por
    # consequência nenhum certificado.

  # O tráfego entra por Cloudflare Tunnel, não pelo proxy do Coolify.
  #
  # Por que: neste servidor o Coolify gera rótulos de Traefik malformados —
  #   rule: Host(``) && PathPrefix(`dominio`)
  # com host vazio — em TODOS os recursos, inclusive nos que funcionam. O que
  # faz os outros funcionarem é o túnel, e é o padrão de FB_SMARTPICK,
  # FB_FAROL, FB_APU02/04/05, FB_AUDITORIA e STOCKFLOW aqui.
  #
  # O cloudflared fica na rede interna e alcança o frontend pelo nome do
  # serviço. O mapeamento hostname -> serviço vive no painel da Cloudflare
  # (Zero Trust -> Networks -> Tunnels -> Public Hostname):
  #
  #     cupom.fbtax.cloud  ->  http://frontend:80
  #
  # O túnel também cria e mantém o registro DNS, então não é preciso registro
  # A manual — e, se existir um, ele deve ser removido para não disputar.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?defina CLOUDFLARE_TUNNEL_TOKEN no painel do Coolify}
    depends_on:
      - frontend

volumes:
  postgres-dados:
